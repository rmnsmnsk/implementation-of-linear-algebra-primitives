name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format build-essential

      - name: Check C format
        run: |
          find src/c_impl src/bench -type f \( -name '*.c' -o -name '*.h' \) \
            -not -path '*/build/*' \
            -exec clang-format --dry-run -Werror {} +

      - name: Build Tests (c_impl)
        working-directory: src/c_impl
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build
          ./build/tests

      - name: Build Benchmark (bench)
        working-directory: src/bench
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build
          ./build/benchmark_c 100 0.05 mm
          ./build/benchmark_c 100 0.05 mv