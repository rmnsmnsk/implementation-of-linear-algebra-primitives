name: Build and lint

on:
  - push
  - pull_request

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-format-18 clang-tools-18

      - name: Check format
        run: |
          find src -name '*.[c|h]' -print | xargs clang-format-18 --style=file --dry-run -Werror

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build build

      - name: Lint
        run: |
          find src -name "*.c" -not -path "*/SuiteSparse/*" | while read file; do
            echo "Linting $file"
            clang-tidy-18 -p=build "$file" --warnings-as-errors=*
          done

      - name: Run tests
        run: |
          if [ -f "build/tests" ]; then
            ./build/tests
          else
            echo "Tests executable not found"
            exit 1
          fi